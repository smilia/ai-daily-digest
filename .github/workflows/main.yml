name: AI Daily Digest

on:
  schedule:
    # 每天北京时间早上8点运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Generate Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          bun scripts/digest.ts --hours 24 --top-n 15 --lang zh --output ./digest.md

      - name: Send to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          CONTENT=$(cat digest.md | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"msg_type\": \"text\", \"content\": {\"text\": \"📰 AI 每日精选日报 $(date +%Y-%m-%d)\n\n${CONTENT:0:3000}\"}}" \
            "${{ secrets.FEISHU_WEBHOOK_URL }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest
          path: digest.md
