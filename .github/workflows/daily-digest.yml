name: AI Daily Digest

on:
  schedule:
    # 每天 UTC 时间 02:00 运行（北京时间 10:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '时间范围（小时）'
        required: false
        default: '24'
        type: string
      top_n:
        description: '精选文章数量'
        required: false
        default: '10'
        type: string
      lang:
        description: '输出语言（zh/en）'
        required: false
        default: 'zh'
        type: string

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
    
    - name: Install dependencies
      run: bun install
    
    - name: Generate Digest with Arcee AI
      env:
        # 使用 Arcee AI 作为主要 API
        OPENAI_API_KEY: ${{ secrets.ARCEE_API_KEY }}
        OPENAI_API_BASE: https://api.arcee.ai/api/v1
        OPENAI_MODEL: trinity-mini
      run: |
        echo "Using Arcee AI with model: trinity-mini"
        bun scripts/digest.ts \
          --hours ${{ github.event.inputs.hours || '24' }} \
          --top-n ${{ github.event.inputs.top_n || '10' }} \
          --lang ${{ github.event.inputs.lang || 'zh' }} \
          --output ./digest.md
        
        echo "========== digest.md content =========="
        cat digest.md
        echo "========== end of digest.md =========="
    
    - name: Extract and Send to Feishu
      env:
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      run: |
        # 创建 Python 脚本来提取内容并发送到飞书
        cat > extract_and_send.py << 'PYTHON_SCRIPT'
        import re
        import os
        import json
        import urllib.request
        import urllib.error
        
        def extract_articles(content):
            """从 digest.md 提取文章信息"""
            articles = []
            
            # 匹配文章标题和链接
            pattern = r'\*\*(.+?)\*\*.*?\[(.+?)\]\((.+?)\).*?— \*\*(.+?)\*\*.*?· ⭐ (\d+/\d+)'  
            matches = re.findall(pattern, content, re.DOTALL)
            
            for match in matches[:10]:  # 最多10篇
                title, link_text, url, source, score = match
                articles.append({
                    'title': title.strip(),
                    'url': url.strip(),
                    'source': source.strip(),
                    'score': score.strip()
                })
            
            return articles
        
        def send_to_feishu(articles):
            """发送消息到飞书"""
            webhook = os.environ.get('FEISHU_WEBHOOK')
            if not webhook:
                print("Error: FEISHU_WEBHOOK not set")
                return False
            
            # 构建卡片内容
            elements = []
            for i, article in enumerate(articles, 1):
                elements.append({
                    "tag": "div",
                    "text": {
                        "tag": "lark_md",
                        "content": f"**{i}. [{article['title']}]({article['url']})**\n📰 {article['source']} · ⭐ {article['score']}"
                    }
                })
                elements.append({"tag": "hr"})
            
            # 移除最后一个分隔线
            if elements:
                elements.pop()
            
            card_data = {
                "msg_type": "interactive",
                "card": {
                    "config": {
                        "wide_screen_mode": True
                    },
                    "header": {
                        "title": {
                            "tag": "plain_text",
                            "content": "📰 AI 博客每日精选"
                        },
                        "subtitle": {
                            "tag": "plain_text",
                            "content": f"精选 {len(articles)} 篇优质文章"
                        },
                        "template": "blue"
                    },
                    "elements": elements
                }
            }
            
            try:
                req = urllib.request.Request(
                    webhook,
                    data=json.dumps(card_data).encode('utf-8'),
                    headers={'Content-Type': 'application/json'},
                    method='POST'
                )
                
                with urllib.request.urlopen(req, timeout=30) as response:
                    result = json.loads(response.read().decode('utf-8'))
                    if result.get('code') == 0:
                        print(f"✅ 成功发送到飞书，共 {len(articles)} 篇文章")
                        return True
                    else:
                        print(f"❌ 飞书返回错误: {result}")
                        return False
                        
            except Exception as e:
                print(f"❌ 发送失败: {e}")
                return False
        
        if __name__ == '__main__':
            # 读取 digest.md
            try:
                with open('digest.md', 'r', encoding='utf-8') as f:
                    content = f.read()
            except FileNotFoundError:
                print("Error: digest.md not found")
                exit(1)
            
            # 提取文章
            articles = extract_articles(content)
            print(f"Extracted {len(articles)} articles")
            
            if articles:
                # 发送到飞书
                success = send_to_feishu(articles)
                exit(0 if success else 1)
            else:
                print("No articles found to send")
                exit(1)
        PYTHON_SCRIPT
        
        # 运行 Python 脚本
        python3 extract_and_send.py
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: daily-digest
        path: digest.md
        retention-days: 30
