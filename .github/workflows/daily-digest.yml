name: AI Daily Digest

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Generate Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARCEE_API_KEY: ${{ secrets.ARCEE_API_KEY }}
        run: |
          # 尝试使用 Gemini，如果失败则使用 Arcee AI
          echo "Trying Gemini API..."
          bun scripts/digest.ts --hours 24 --top-n 10 --lang zh --output ./digest.md || {
            echo "Gemini failed, trying Arcee AI..."
            
            # 修改脚本使用 Arcee AI
            export OPENAI_API_KEY="$ARCEE_API_KEY"
            export OPENAI_API_BASE="https://api.arcee.ai/api/v1"
            export OPENAI_MODEL="arcee-auto"
            
            # 重新运行脚本
            bun scripts/digest.ts --hours 24 --top-n 10 --lang zh --output ./digest.md
          }
          
          echo "========== digest.md content =========="
          cat digest.md
          echo "========== end of digest.md =========="

      - name: Extract and Send to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          
          # 创建 Python 脚本文件
          cat > extract.py << 'PYEOF'
          import re
          import json
          
          with open('digest.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          print("DEBUG: File loaded, length:", len(content))
          
          # 提取统计信息
          stats_match = re.search(r'\| 扫描源 \| 抓取文章 \| 时间范围 \| 精选 \|\n\|[^|]+\|[^|]+\|[^|]+\|[^|]+\|\n\|([^|]+)\|([^|]+)\|([^|]+)\|([^|]+)\|', content)
          if stats_match:
              scanned = stats_match.group(1).strip()
              fetched = stats_match.group(2).strip()
              time_range = stats_match.group(3).strip()
              selected = stats_match.group(4).strip().replace('**', '').replace('篇', '').strip()
          else:
              scanned, fetched, time_range, selected = "92", "-", "24h", "10"
          
          md_content = f"**📊 数据概览**\\n\\n"
          md_content += f"• 扫描源：{scanned}\\n"
          md_content += f"• 抓取文章：{fetched}\\n"
          md_content += f"• 时间范围：{time_range}\\n"
          md_content += f"• 精选：{selected} 篇\\n\\n"
          md_content += "---\\n\\n"
          md_content += "**🏆 今日必读 Top 3**\\n\\n"
          
          # 提取今日必读部分
          top_section = re.search(r'## 🏆 今日必读(.*?)(?=## |$)', content, re.DOTALL)
          
          if top_section:
              section = top_section.group(1)
              print("DEBUG: Top section found, length:", len(section))
              
              # 按文章分割（以 🥇 🥈 🥉 为分隔）
              articles = re.split(r'(🥇|🥈|🥉)', section)
              
              for i in range(1, len(articles), 2):
                  if i < len(articles):
                      emoji = articles[i]
                      article_content = articles[i+1] if i+1 < len(articles) else ""
                      
                      # 提取标题（**标题**）
                      title_match = re.search(r'\*\*([^*]+)\*\*', article_content)
                      title = title_match.group(1).strip() if title_match else "未知标题"
                      
                      # 提取链接 [text](url)
                      link_match = re.search(r'$$([^$$]+)\]$(https?://[^)]+)$', article_content)
                      link_url = link_match.group(2) if link_match else ""
                      
                      # 提取来源 — source · time · category
                      source_match = re.search(r'—\s*([^·\n]+)', article_content)
                      source = source_match.group(1).strip() if source_match else ""
                      
                      # 提取摘要（> 开头）
                      summary_match = re.search(r'>\s*([^\n]+)', article_content)
                      summary = summary_match.group(1).strip() if summary_match else ""
                      
                      print(f"DEBUG: {emoji} {title[:50]}... link={link_url[:50] if link_url else 'None'}")
                      
                      # 构建输出
                      if link_url:
                          md_content += f"{emoji} [{title}]({link_url})\\n"
                      else:
                          md_content += f"{emoji} {title}\\n"
                      
                      if source:
                          md_content += f"📰 {source}\\n"
                      if summary:
                          md_content += f"💡 {summary[:100]}...\\n"
                      md_content += "\\n"
                      
                      if i >= 5:  # 只取前3篇
                          break
          
          print("=== EXTRACTED CONTENT ===")
          print(md_content)
          print("=== END ===")
          
          # 输出到文件供后续使用
          with open('extracted_content.txt', 'w', encoding='utf-8') as f:
              f.write(md_content)
          PYEOF
          
          # 运行 Python 脚本
          python3 extract.py
          
          # 构建飞书卡片 JSON
          python3 << EOF > feishu_payload.json
          import json
          
          with open('extracted_content.txt', 'r', encoding='utf-8') as f:
              content = f.read()
          
          data = {
              "msg_type": "interactive",
              "card": {
                  "config": {"wide_screen_mode": True},
                  "header": {
                      "title": {"tag": "plain_text", "content": "📰 AI 每日精选日报 $(date +%Y-%m-%d)"},
                      "template": "blue"
                  },
                  "elements": [
                      {
                          "tag": "div",
                          "text": {"tag": "lark_md", "content": content}
                      },
                      {
                          "tag": "hr"
                      },
                      {
                          "tag": "note",
                          "elements": [{"tag": "plain_text", "content": "🤖 由 AI 智能评分筛选 | 点击按钮查看更多详情"}]
                      },
                      {
                          "tag": "action",
                          "actions": [
                              {
                                  "tag": "button",
                                  "text": {"tag": "plain_text", "content": "📄 查看完整日报"},
                                  "type": "primary",
                                  "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                              }
                          ]
                      }
                  ]
              }
          }
          
          print(json.dumps(data))
          EOF
          
          echo "=== Sending to Feishu ==="
          cat feishu_payload.json
          
          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @feishu_payload.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ github.run_id }}
          path: |
            digest.md
            extracted_content.txt
