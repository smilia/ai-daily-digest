name: AI Daily Digest

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Generate Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          bun scripts/digest.ts --hours 24 --top-n 10 --lang zh --output ./digest.md
          
          echo "========== digest.md content =========="
          cat digest.md
          echo "========== end of digest.md =========="

      - name: Extract and Send to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          
          ARTICLES_MD=$(python3 << 'PYTHON'
          import re
          
          with open('digest.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          print("DEBUG: File loaded, length:", len(content))
          
          # 提取统计信息
          stats_match = re.search(r'\| 扫描源 \| 抓取文章 \| 时间范围 \| 精选 \|\n\|[^|]+\|[^|]+\|[^|]+\|[^|]+\|\n\|([^|]+)\|([^|]+)\|([^|]+)\|([^|]+)\|', content)
          if stats_match:
              scanned = stats_match.group(1).strip()
              fetched = stats_match.group(2).strip()
              time_range = stats_match.group(3).strip()
              selected = stats_match.group(4).strip()
          else:
              scanned, fetched, time_range, selected = "92", "-", "24h", "10"
          
          md_content = f"**📊 数据概览**\\n\\n"
          md_content += f"• 扫描源：{scanned}\\n"
          md_content += f"• 抓取文章：{fetched}\\n"
          md_content += f"• 时间范围：{time_range}\\n"
          md_content += f"• 精选：{selected} 篇\\n\\n"
          md_content += "---\\n\\n"
          md_content += "**🏆 今日必读**\\n\\n"
          
          # 提取今日必读部分 - 更宽松的模式
          top_section = re.search(r'## 🏆 今日必读(.*?)(?=## |$)', content, re.DOTALL)
          
          if top_section:
              section = top_section.group(1)
              print("DEBUG: Top section found, length:", len(section))
              
              # 查找所有文章块
              # 文章格式：🥇 **标题** — 来源 · 时间 · 分类\n\n> 摘要\n\n链接
              article_blocks = re.findall(
                  r'(🥇|🥈|🥉)\s+\*\*([^*]+)\*\*\s*—\s*([^·\n]+)[^\\n]*\\n\\n>\s*([^\\n]+)(?:\\n\\n)?(?:\$$([^$$]+)\]$([^)]+)$)?',
                  section,
                  re.DOTALL
              )
              
              print(f"DEBUG: Found {len(article_blocks)} articles with detailed pattern")
              
              for i, (emoji, title, source, summary, link_text, link_url) in enumerate(article_blocks[:5], 1):
                  clean_title = title.strip()
                  clean_source = source.strip()
                  clean_summary = summary.strip()
                  
                  print(f"DEBUG: Article {i}: {clean_title[:50]}...")
                  
                  if link_url:
                      md_content += f"{emoji} [{clean_title}]({link_url})\\n"
                  else:
                      md_content += f"{emoji} {clean_title}\\n"
                  
                  md_content += f"📰 {clean_source}\\n"
                  md_content += f"💡 {clean_summary[:120]}\\n\\n"
              
              # 如果没匹配到详细格式，尝试简单提取
              if len(article_blocks) == 0:
                  print("DEBUG: Trying simple pattern")
                  simple_articles = re.findall(r'(🥇|🥈|🥉)\s+\*\*([^*]+)\*\*', section)
                  print(f"DEBUG: Found {len(simple_articles)} articles with simple pattern")
                  
                  for emoji, title in simple_articles[:5]:
                      clean_title = title.strip()
                      md_content += f"{emoji} {clean_title}\\n\\n"
          
          else:
              print("DEBUG: Top section not found!")
              # 尝试查找任何带emoji的标题
              all_emoji = re.findall(r'(🥇|🥈|🥉)[^\n]*', content)
              print(f"DEBUG: Found {len(all_emoji)} emoji lines in full content")
          
          print("DEBUG: Final content length:", len(md_content))
          print("=== EXTRACTED CONTENT START ===")
          print(md_content)
          print("=== EXTRACTED CONTENT END ===")
          PYTHON
          )
          
          # 使用 Python 正确转义 JSON
          JSON_DATA=$(python3 << EOF
          import json
          
          content = '''$ARTICLES_MD'''
          
          data = {
              "msg_type": "interactive",
              "card": {
                  "config": {"wide_screen_mode": True},
                  "header": {
                      "title": {"tag": "plain_text", "content": "📰 AI 每日精选日报 $(date +%Y-%m-%d)"},
                      "template": "blue"
                  },
                  "elements": [
                      {
                          "tag": "div",
                          "text": {"tag": "lark_md", "content": content}
                      },
                      {
                          "tag": "hr"
                      },
                      {
                          "tag": "note",
                          "elements": [{"tag": "plain_text", "content": "🤖 由 AI 智能评分筛选 | 点击按钮查看更多详情"}]
                      },
                      {
                          "tag": "action",
                          "actions": [
                              {
                                  "tag": "button",
                                  "text": {"tag": "plain_text", "content": "📄 查看完整日报"},
                                  "type": "primary",
                                  "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                              }
                          ]
                      }
                  ]
              }
          }
          
          print(json.dumps(data))
          EOF
          )
          
          echo "=== Sending to Feishu ==="
          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$JSON_DATA"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ github.run_id }}
          path: digest.md
