name: AI Daily Digest

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Generate Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          bun scripts/digest.ts --hours 24 --top-n 10 --lang zh --output ./digest.md
          
          # 输出生成的内容用于调试
          echo "=== Generated digest.md ==="
          head -100 digest.md

      - name: Extract and Send to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          
          ARTICLES_MD=$(python3 << 'PYTHON'
          import re
          
          with open('digest.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # 提取统计信息
          stats_match = re.search(r'\| 扫描源 \| 抓取文章 \| 时间范围 \| 精选 \|\n\|[^|]+\|[^|]+\|[^|]+\|[^|]+\|\n\|([^|]+)\|([^|]+)\|([^|]+)\|([^|]+)\|', content)
          if stats_match:
              scanned = stats_match.group(1).strip()
              fetched = stats_match.group(2).strip()
              time_range = stats_match.group(3).strip()
              selected = stats_match.group(4).strip()
          else:
              scanned, fetched, time_range, selected = "92", "-", "24h", "10"
          
          md_content = f"**📊 数据概览**\\n\\n"
          md_content += f"• 扫描源：{scanned}\\n"
          md_content += f"• 抓取文章：{fetched}\\n"
          md_content += f"• 时间范围：{time_range}\\n"
          md_content += f"• 精选：{selected} 篇\\n\\n"
          md_content += "---\\n\\n"
          md_content += "**🏆 今日必读 Top 5**\\n\\n"
          
          # 提取今日必读部分
          top_section = re.search(r'## 🏆 今日必读(.*?)(?:## 📊|## 📝|$)', content, re.DOTALL)
          
          if top_section:
              section = top_section.group(1)
              
              # 提取文章块：标题、来源、摘要
              # 格式：🥇 Title — source · time · category\n\n> summary
              pattern = r'(🥇|🥈|🥉)\s+([^—\n]+)—\s*([^·\n]+)[^\\n]*\\n\\n>\s*([^\n]+)'
              matches = re.findall(pattern, section, re.DOTALL)
              
              for emoji, title, source, summary in matches[:5]:
                  clean_title = title.strip()
                  clean_source = source.strip()
                  clean_summary = summary.strip()
                  
                  # 尝试在标题附近找链接 [title](url)
                  # 链接可能在标题后的任何位置
                  title_escaped = re.escape(clean_title[:30])  # 只取前30字符避免特殊字符
                  link_pattern = r'$$([^$$]*' + title_escaped + r'[^\]]*)\]$(https?://[^)]+)$'
                  link_match = re.search(link_pattern, content, re.IGNORECASE)
                  
                  if link_match:
                      link_url = link_match.group(2)
                      md_content += f"{emoji} [{clean_title}]({link_url})\\n"
                  else:
                      md_content += f"{emoji} {clean_title}\\n"
                  
                  md_content += f"📰 {clean_source}\\n"
                  md_content += f"💡 {clean_summary[:100]}...\\n\\n"  # 限制摘要长度
          
          # 如果没提取到，使用备用方案
          if "🥇" not in md_content or len(md_content) < 200:
              # 简单提取所有带emoji的标题行
              lines = content.split('\n')
              count = 0
              emojis = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣']
              for line in lines:
                  if any(e in line for e in ['🥇', '🥈', '🥉']):
                      # 清理行
                      clean_line = line.strip()
                      if clean_line and count < 5:
                          md_content += f"{emojis[count]} {clean_line.replace('🥇', '').replace('🥈', '').replace('🥉', '').strip()}\\n\\n"
                          count += 1
          
          print(md_content)
          PYTHON
          )
          
          echo "=== Extracted content ==="
          echo "$ARTICLES_MD"
          
          # 转义特殊字符用于 JSON
          ARTICLES_ESCAPED=$(echo "$ARTICLES_MD" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          
          # 构建飞书卡片 JSON
          JSON_DATA=$(jq -n \
            --arg title "📰 AI 每日精选日报 $(date +%Y-%m-%d)" \
            --arg content "$ARTICLES_MD" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              "msg_type": "interactive",
              "card": {
                "config": {"wide_screen_mode": true},
                "header": {
                  "title": {"tag": "plain_text", "content": $title},
                  "template": "blue"
                },
                "elements": [
                  {
                    "tag": "div",
                    "text": {"tag": "lark_md", "content": $content}
                  },
                  {
                    "tag": "hr"
                  },
                  {
                    "tag": "note",
                    "elements": [{"tag": "plain_text", "content": "🤖 由 AI 智能评分筛选 | 点击按钮查看更多详情"}]
                  },
                  {
                    "tag": "action",
                    "actions": [
                      {
                        "tag": "button",
                        "text": {"tag": "plain_text", "content": "📄 查看完整日报"},
                        "type": "primary",
                        "url": $url
                      }
                    ]
                  }
                ]
              }
            }')
          
          echo "=== JSON payload ==="
          echo "$JSON_DATA" | head -c 1000
          
          curl -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$JSON_DATA"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ github.run_id }}
          path: digest.md
